<style>
/* Layout: one dense, sortable ranked ledger under a quiet masthead; a book switch (when there is more than one) sits above the search. */
:root{--bg:#f3f4f2;--surface:#ffffff;--fg:#17201c;--muted:#5d6a63;--rule:#d5dad6;--accent:#0f5c4a;--neg:#b3261e;--pos:#0f6b45;--chip:#e6ebe7;
--display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--surface:#171f1b;--fg:#e4ebe6;--muted:#93a39a;--rule:#2a352f;--accent:#5fc3a5;--neg:#ff8a80;--pos:#7ddbb0;--chip:#222d27;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101613;--surface:#171f1b;--fg:#e4ebe6;--muted:#93a39a;--rule:#2a352f;--accent:#5fc3a5;--neg:#ff8a80;--pos:#7ddbb0;--chip:#222d27;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:28px 48px}
main{max-width:1100px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.05;margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:68ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--accent);border-radius:5px;overflow:hidden;align-self:flex-start}
.seg button{font:600 14px var(--display);background:transparent;color:var(--accent);border:0;padding:8px 16px;cursor:pointer}
.seg button+button{border-left:1px solid var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.seg small{font:400 12px var(--mono);margin-left:6px;opacity:.85}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search]{font:400 14px var(--mono);background:var(--surface);color:var(--fg);border:1px solid var(--rule);border-radius:4px;padding:6px 10px;width:170px}
.copy{font:500 13px var(--display);background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:5px 12px;cursor:pointer}
.wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:780px;font-variant-numeric:tabular-nums}
th,td{padding:9px 14px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
th.l,td.l{text-align:left}
th{font:500 12px var(--display);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:0;background:var(--surface)}
th button{all:unset;display:block;box-sizing:border-box;width:100%;padding:10px 14px;cursor:pointer;text-align:inherit}
th[aria-sort="ascending"] button::after{content:" \25B2";font-size:9px}
th[aria-sort="descending"] button::after{content:" \25BC";font-size:9px}
tbody tr:last-child td{border-bottom:0}
td{font-family:var(--mono);font-size:13.5px}
td.rk{color:var(--muted)}
td.sym{font:600 15px var(--display);letter-spacing:.01em}
td.nm{font:400 13px var(--display);color:var(--muted);white-space:normal;min-width:180px;max-width:300px}
td.neg{color:var(--neg)} td.pos{color:var(--pos)}
.method{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.method h2{font:600 18px var(--display);margin:0}
.method p{margin:0;max-width:78ch;color:var(--fg)}
.method ol{margin:0;padding-left:20px;max-width:78ch}
.mt{overflow-x:auto}.mt table{min-width:480px}
.mt td,.mt th{padding:7px 12px}.mt td{font-size:13px}.mt .bar{display:inline-block;height:8px;background:var(--accent);border-radius:2px;vertical-align:middle;margin-left:8px}
.foot{color:var(--muted);font-size:13px;max-width:82ch}
.foot a{color:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted)}
#secs{display:flex;flex-direction:column;gap:22px}.isec{display:flex;flex-direction:column;gap:8px}
.isec h2{font:600 18px var(--display);margin:0;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}.isec h2 small{font:400 12.5px var(--mono);color:var(--muted)}
</style>

<script>
(function(){
  var D=JSON.parse(document.getElementById('data').textContent);
  var $=function(i){return document.getElementById(i)};
  var g=0,q='';function G(){return D.groups[g]}function C(){return G().cols||D.cols}var sortK=G().defaultSort||D.defaultSort,sortD=G().defaultDir||D.defaultDir;
  function methodDraw(){var m=G().method;if(!m){$('method').hidden=true;return}$('method').hidden=false;
    var h='<h2>'+esc(m.title)+'</h2>'+m.logic.map(function(p){return '<p>'+esc(p)+'</p>'}).join('');
    if(m.steps)h+='<ol>'+m.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>';
    if(m.table){var mx=Math.max.apply(null,m.table.rows.map(function(r){return r[m.table.w]}));
      h+='<div class="mt"><table><thead><tr>'+m.table.head.map(function(x,i){return '<th class="'+(i<m.table.left?'l':'')+'" style="padding:7px 12px">'+esc(x)+'</th>'}).join('')+'</tr></thead><tbody>'+m.table.rows.map(function(r){return '<tr>'+r.map(function(x,i){return i===m.table.w?'<td>'+x.toFixed(1)+'%<span class="bar" style="width:'+Math.round(x/mx*90)+'px"></span></td>':'<td class="'+(i<m.table.left?'l':'')+'" style="font-family:var(--display)">'+esc(x)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
    $('method').innerHTML=h}
  function texts(){methodDraw();$('sub').textContent=G().sub||D.sub;$('foot').innerHTML=(G().foot||D.foot)+' Market data only; not investment advice.'}
  $('meta').innerHTML=D.meta.map(function(m){return '<span>'+m[0]+' <b>'+m[1]+'</b></span>'}).join('');
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
  function fmt(c,v){
    if(v==null||v==='')return '<td class="'+(c.l?'l ':'')+'">n/a</td>';
    if(c.type==='text')return '<td class="'+(c.cls||'')+(c.l?' l':'')+'">'+esc(v)+'</td>';
    if(c.type==='pct')return '<td class="'+(v<0?'neg':'pos')+'">'+(v>0?'+':'')+v.toFixed(1)+'%</td>';
    if(c.type==='plain')return '<td>'+v.toFixed(1)+'%</td>';
    if(c.type==='vol')return '<td>'+Math.round(v).toLocaleString('en-US')+'</td>';
    if(c.type==='price')return '<td>'+v.toFixed(2)+'</td>';
    if(c.type==='pct2')return '<td class="'+(v<0?'neg':'pos')+'">'+(v>0?'+':'')+v.toFixed(2)+'%</td>';
    if(c.type==='z')return '<td class="neg">'+v.toFixed(2)+'</td>';
    if(c.type==='dec')return '<td>'+v.toFixed(1)+'</td>';
    if(c.type==='score')return '<td class="'+(v<0?'neg':'pos')+'"><b>'+(v>0?'+':'')+v.toFixed(1)+'</b></td>';
    if(c.type==='moneyc')return '<td>'+(v>=1e9?'C$'+(v/1e9).toFixed(v>=1e10?1:2)+'B':'C$'+Math.round(v/1e6)+'M')+'</td>';
    if(c.type==='money')return '<td>'+(v>=1e9?'$'+(v/1e9).toFixed(v>=1e10?1:2)+'B':'$'+Math.round(v/1e6)+'M')+'</td>';
    return '<td>'+esc(v)+'</td>';
  }
  if(D.groups.length>1){$('seg').hidden=false;$('seg').innerHTML=D.groups.map(function(x,i){return '<button type="button" data-g="'+i+'" aria-pressed="'+(i===0)+'">'+esc(x.name)+'<small>'+(x.count!=null?x.count:x.rows.length)+'</small></button>'}).join('');
    $('seg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;g=+b.dataset.g;Array.prototype.forEach.call($('seg').children,function(c){c.setAttribute('aria-pressed',c===b)});sortK=G().defaultSort||D.defaultSort;sortD=G().defaultDir||D.defaultDir;head();draw()})}
  function head(){$('head').innerHTML=C().map(function(c){return '<th class="'+(c.l?'l':'')+'" data-k="'+c.k+'"><button type="button">'+esc(c.t)+'</button></th>'}).join('')}
  function sortClick(e){var th=e.target.closest('th');if(!th)return;var k=th.dataset.k;if(sortK===k)sortD=-sortD;else{sortK=k;sortD=(k==='symbol'||k==='name')?1:-1;if(k==='rank'||k==='medrank')sortD=1}draw()}
  $('head').addEventListener('click',sortClick);$('secs').addEventListener('click',sortClick);
  $('q').addEventListener('input',function(e){q=e.target.value.trim().toUpperCase();draw()});
  function sortRows(rs){return rs.filter(function(r){return !q||String(r.symbol).toUpperCase().indexOf(q)>=0||String(r.name||'').toUpperCase().indexOf(q)>=0}).sort(function(a,b){var x=a[sortK],y=b[sortK];if(x==null)x=-1e18;if(y==null)y=-1e18;return (x<y?-1:x>y?1:0)*sortD})}
  function view(){if(G().sections){var seen={},o=[];G().sections.forEach(function(s){sortRows(s.rows).forEach(function(r){if(!seen[r.symbol]){seen[r.symbol]=1;o.push(r)}})});return o}return sortRows(G().rows)}
  function row(r){return '<tr>'+C().map(function(c){return fmt(c,r[c.k])}).join('')+'</tr>'}
  function draw(){
    var sc=G().sections;$('wrapMain').hidden=!!sc;$('secs').hidden=!sc;
    if(sc){texts();$('secs').innerHTML=sc.map(function(s){var rs=sortRows(s.rows);return '<section class="isec"><h2>'+esc(s.title)+'<small>'+rs.length+(rs.length===s.rows.length?'':' of '+s.rows.length)+' names'+(s.note?' · '+esc(s.note):'')+'</small></h2><div class="wrap"><table><thead><tr>'+C().map(function(c){return '<th class="'+(c.l?'l':'')+'" data-k="'+c.k+'" aria-sort="'+(c.k===sortK?(sortD>0?'ascending':'descending'):'none')+'"><button type="button">'+esc(c.t)+'</button></th>'}).join('')+'</tr></thead><tbody>'+(rs.length?rs.map(row).join(''):'<tr><td colspan="'+C().length+'" class="l" style="color:var(--muted)">No names pass today.</td></tr>')+'</tbody></table></div></section>'}).join('');return}
    Array.prototype.forEach.call($('head').children,function(th){th.setAttribute('aria-sort',th.dataset.k===sortK?(sortD>0?'ascending':'descending'):'none')});
    var v=view();
    texts();$('rows').innerHTML=v.map(row).join('');
    $('empty').hidden=v.length>0;
  }
  $('copy').addEventListener('click',function(){var s=view().map(function(r){return r.symbol}).join(',');var b=$('copy');
    function done(t){b.textContent=t;setTimeout(function(){b.textContent='Copy symbols'},1600)}
    try{navigator.clipboard.writeText(s).then(function(){done('Copied')},function(){done(s)})}catch(e){done(s)}});
  head();draw();
})();
</script>
